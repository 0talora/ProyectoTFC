services:
  mysql:
    image: mysql:8.0
    container_name: AirsoftBDD
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "rootpasswd"
      MYSQL_DATABASE: Airsoft
      MYSQL_USER: "usuario"
      MYSQL_PASSWORD: "usuariopasswd"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: